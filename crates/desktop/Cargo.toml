[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
authors = ["troidem <mxmgorin@gmail.com>"]

[features]
default = ["frontend-modern", "file-dialog", "file-browser"]
frontend-modern = ["app/frontend-modern"]
frontend-retro = ["app/frontend-retro"]
file-dialog = ["tinyfiledialogs", "app/file-dialog"]
file-browser = ["app/file-browser"]
sdl2-bundled = ["app/sdl2-bundled"]
debug = ["app/debug"]

[dependencies]
core = { path = "../core" }
app = { path = "../app", default-features = false }
tinyfiledialogs = { version = "3.9", optional = true }
log = "0.4.27"
env_logger = "0.11.8"

# Embeds the app icon + version metadata into oxgbc.exe via build.rs. Windows
# hosts only, so desktop/Linux/macOS builds never fetch or compile it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "oxgbc"
path = "src/main.rs"